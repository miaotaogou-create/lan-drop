<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 蓝紫色大圆角背景 -->
  <rect x="2" y="2" width="56" height="56" rx="16" fill="#6366F1"/>
  <!-- 中间纯白大写加粗 W -->
  <text x="29" y="38" font-family="'Segoe UI', -apple-system, Roboto, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="middle">W</text>
  <!-- 右下角白色悬浮圆形底座（带微弱柔和立体阴影） -->
  <circle cx="48" cy="48" r="14.5" fill="#000000" opacity="0.08"/>
  <circle cx="48" cy="48" r="14" fill="#FFFFFF"/>
  <!-- 内部纯正蓝色主机 / 硬盘角标 -->
  <rect x="40.5" y="47" width="15" height="7" rx="1.8" fill="none" stroke="#2563EB" stroke-width="1.8"/>
  <path d="M42.5 47 L44.2 42.8 A1 1 0 0 1 45.2 42.2 L50.8 42.2 A1 1 0 0 1 51.8 42.8 L53.5 47" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="44.2" cy="50.5" r="0.9" fill="#2563EB"/>
  <circle cx="47.5" cy="50.5" r="0.9" fill="#2563EB"/>
</svg>
